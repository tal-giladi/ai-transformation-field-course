- id: q1
  question: >-
    In the test, the grant drafter wrote "twelve Arabic-speaking groups a month" where the numbers sheet
    has no such figure. Your threshold was zero numbers without a source. What do you do?
  options:
    - >-
      Accept it as a minor error, since 8 of 10 drafts were usable and Noa edits everything anyway.
    - >-
      Change the threshold to one invented number per ten drafts, since the test showed that is realistic.
    - >-
      Record the fail, tighten the instructions in a new version, re-run that item, and keep the bracket check.
    - >-
      Remove the numbers sheet from the sources, so the drafter cannot cite figures at all.
  correct: 2
  explanation: >-
    The threshold was dated before the run for exactly this case. A versioned fix and a re-run keep the
    pilot honest; moving the threshold or shrugging it off defeats the reason for writing it, and
    removing the sheet makes every draft worse.

- id: q2
  question: >-
    The case-note helper stopped an identifiable note two times out of three. A coordinator says "two out
    of three is pretty good". What follows for the workflow?
  options:
    - >-
      The helper is not the control: the coordinator removes the details, and the STOP is only a backup.
    - >-
      The workflow is stopped until a model is found that stops the note in every run.
    - >-
      The coordinator runs each note through the helper three times before using the output.
    - >-
      Identifiable notes are allowed after all, because the helper catches most of them anyway.
  correct: 0
  explanation: >-
    A check that works two times in three is a probability. The design puts the person first and keeps
    the automatic STOP as a second line; stopping everything or running notes three times treats the tool
    as the control, which it cannot be.

- id: q3
  question: >-
    Yossi's hand-pseudonymised export of 60 notes is the input for your test. The rule-based script flags
    7 notes; a careful read finds 9. What is the most important lesson for the organization?
  options:
    - >-
      The script should be improved until it finds all 9, then it can replace the human read.
    - >-
      Yossi should not have exported the notes, so the test should use invented notes instead.
    - >-
      Nine leaks in sixty notes are few enough to accept for a synthetic test of the workflow.
    - >-
      "Pseudonymised" is a claim to test, and names in Hebrew or Arabic script need a person to catch them.
  correct: 3
  explanation: >-
    A hand-made export leaked in 15% of notes and the script missed the native-script names. Treat every
    export as unverified and keep a person's read as the control; no script will reliably find names in
    every script.

- id: q4
  question: >-
    Everyone who looked at the Amharic letter thought it read well. Only one coordinator reads Amharic.
    What do you do before deciding?
  options:
    - >-
      Have the coordinator who reads Amharic judge it, and keep Amharic human if she rejects it.
    - >-
      Back-translate it into Hebrew with the same tool and compare it with the original note.
    - >-
      Accept it, because the model's Amharic is usually as good as its Arabic and Russian.
    - >-
      Drop all letters from the workflow until every language has been tested by an outside translator.
  correct: 0
  explanation: >-
    Only a reader of the language can judge a letter to a family; back-translation with the same tool
    hides its own errors. In the worked example Tigist found wrong register and errors of meaning, so
    Amharic stays human while Arabic and Russian go ahead.

- id: q5
  question: >-
    Which shows that the one-page policy is the policy pack and not a shortcut around it?
  options:
    - >-
      It is signed by every staff member and volunteer, with the signatures kept by Yossi.
    - >-
      Each rule maps to a Stage 1 document it replaces, and the open legal questions sit with counsel.
    - >-
      It cites every law that applies, with section numbers, so staff know the legal basis.
    - >-
      It was generated by the grant drafter from the full Harbor & Pine policy pack.
  correct: 1
  explanation: >-
    The page is the pack sized for 30 people: use policy, approved list, boundary, human review,
    inventory, incident and governance each have a rule, and the DPIA questions go to the lawyer.
    Signatures and citations do not make anyone follow it.
